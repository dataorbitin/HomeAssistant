name: Backend checks
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: concierge
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: concierge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U concierge -d concierge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://concierge:local-ci-only@localhost:5432/concierge_test
      TEST_POSTGRES_URL: postgresql+psycopg://concierge:local-ci-only@localhost:5432/concierge_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check app scripts tests alembic
      - run: ruff format --check app scripts tests alembic
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m scripts.seed
      - run: python -m scripts.seed
      - run: pytest -q
      - run: alembic downgrade base
      - run: alembic upgrade head
